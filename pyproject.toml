[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterbuild"
version = "0.1.0"
description = "Turn a finished codebase into a document (docs, reports, storytelling, case study)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Satyam Mohanty", email = "satyammohanty892@gmail.com"}]
keywords = ["documentation", "cli", "pandoc", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "GitPython>=3.1",
    "pydantic>=2.0",
    "pandocfilters>=1.5",
    "python-docx>=0.8.11",
    "weasyprint>=59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.package-data]
"afterbuild" = ["skill/**/*.md", "skill/*.md"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^build/"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[project.scripts]
afterbuild = "afterbuild.cli:main"
